<script>
/* ===================== 헥스 수학 (axial, pointy-top) ===================== */
let SIZE=44, R=4; const OX=380, OY=350;   // SIZE·R = 레벨마다 바뀜(반경 3/4/5)
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const key=(q,r)=>q+","+r;
function hexDist(a,b){return (Math.abs(a.q-b.q)+Math.abs(a.q+a.r-b.q-b.r)+Math.abs(a.r-b.r))/2;}
function px(q,r){return {x:OX+SIZE*Math.sqrt(3)*(q+r/2), y:OY+SIZE*1.5*r};}
function hexPoly(q,r){const c=px(q,r);let p="";for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p+=(c.x+SIZE*0.94*Math.cos(a))+","+(c.y+SIZE*0.94*Math.sin(a))+" ";}return p;}
let TILES=[];
function rebuildTiles(){ TILES=[]; for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++){ if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=R) TILES.push({q,r}); } }
rebuildTiles();
function inField(q,r){return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=R;}
function tilesIn(q,r,rad){const o=[];TILES.forEach(t=>{if(hexDist({q,r},t)<=rad)o.push(t);});return o;}

/* 과녁=눈 (살란 정본 §4-6): 벽이 시야를 끊는다. 큐브 좌표 라인 드로. */
function cubeRound(x,y,z){let rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
  const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);
  if(dx>dy&&dx>dz)rx=-ry-rz; else if(dy>dz)ry=-rx-rz; else rz=-rx-ry; return {q:rx,r:rz};}
function hexLine(a,b){const N=hexDist(a,b); if(N===0)return[{q:a.q,r:a.r}];
  const out=[]; for(let i=0;i<=N;i++){const t=i/N;
    const x=a.q+(b.q-a.q)*t, z=a.r+(b.r-a.r)*t, y=(-a.q-a.r)+((-b.q-b.r)-(-a.q-a.r))*t;
    out.push(cubeRound(x,y,z));} return out;}
function hasLoS(a,b){ // 벽이 중간을 막으면 시야 끊김 (양 끝 제외)
  const line=hexLine(a,b);
  for(let i=1;i<line.length-1;i++){ if(S.walls[key(line[i].q,line[i].r)]) return false; }
  return true;
}

let CURLEVEL=0;
function applyLevel(i){ CURLEVEL=i; const L=LEVELS[i]; R=L.R; SIZE = R<=3?54 : R>=5?32 : 44; rebuildTiles();
  const fl=(typeof document!=='undefined')&&document.getElementById('stageflavor'); if(fl) fl.textContent='【'+L.stage+'】 '+L.flavor;
  fresh(); }

/* ===================== 게임 상태 ===================== */
let S;
const KAN_MAX=6;
function fresh(){
  const L=LEVELS[CURLEVEL];
  S={ round:1, turn:'player', kan:KAN_MAX, kanMax:KAN_MAX, refund:0, lastEl:null, sel:null,
      walls:{}, surf:{}, jin:{}, over:false, charge:null, filt:'전체', level:L,
    units:{ player:{side:'player',name:L.player.name,q:L.player.q,r:L.player.r,hp:L.player.hp,max:L.player.hp,shield:0,slow:0,frozen:0,exposed:false},
            enemy:{ side:'enemy',name:L.enemy.name,q:L.enemy.q,r:L.enemy.r,hp:L.enemy.hp,max:L.enemy.hp,shield:0,slow:0,frozen:0,exposed:false} } };
  for(const k in L.surf) S.surf[k]=L.surf[k];
  for(const w of L.walls) S.walls[w]={dur:99999};   // 지형 벽 = 안 삭음
  log('<span class="warn">【'+L.stage+'】</span> <span class="t">'+L.flavor+' · 목표: '+L.obj+'</span>');
  log('<span class="sys">개전. 칸=행동 슬롯(완성 예산). 큰 영창은 여러 칸·완성까지 무방비. 언령=과녁은 눈, 주술=벽 뒤 우회.</span>');
  render();
}
function unitAt(q,r){for(const u of Object.values(S.units)) if(u.hp>0&&u.q===q&&u.r===r) return u; return null;}
function log(h){const el=document.getElementById('log');if(el)el.insertAdjacentHTML('afterbegin','<div>'+h+'</div>');}
function short(u){return u.side==='player'?'아군':'적';}

/* ===================== 표면 적용 ===================== */
function applySurface(q,r,s){
  const k=key(q,r), cur=S.surf[k];
  if(s==='서리' && cur==='젖음'){ S.surf[k]='얼음판'; log('<span class="sis">젖음+서리 → 얼음판</span> ('+q+','+r+')'); freezeIfOn(q,r); return; }
  if(s==='불' && (cur==='젖음'||cur==='얼음판')){ delete S.surf[k]; log('<span class="warn">불이 젖은 자리에서 꺼짐(소화)</span>'); return; }
  if(cur==='불' && s==='젖음'){ delete S.surf[k]; log('<span class="warn">물이 불을 끔</span>'); return; }
  S.surf[k]=s;
}
function freezeIfOn(q,r){const u=unitAt(q,r); if(u){u.frozen=Math.max(u.frozen,1); log('<span class="sis">'+short(u)+' 발이 얼음판에 얼어붙음</span>');}}

/* ===================== 데미지 (영창 무방비=자리 값 ×1.5) ===================== */
function dealDmg(u,amt,tag){
  let a=amt;
  if(u.exposed){ a=Math.round(a*1.5); }
  if(u.shield>0){const ab=Math.min(u.shield,a);u.shield-=ab;a-=ab; if(ab>0)log('<span class="sys">'+short(u)+' 방패가 '+ab+' 막음</span>');}
  u.hp=Math.max(0,u.hp-a);
  log('<span class="dmg">'+short(u)+'에 '+a+' 피해</span> '+(tag||'')+(u.exposed?' <span class="warn">(영창 무방비!)</span>':'')+' → HP '+u.hp);
  if(u.hp<=0){ S.over=true; log('<span class="warn">★ '+short(u)+' 쓰러짐 — '+(u.side==='player'?'패배':'승리')+'</span>'); }
}

/* ===================== 칸 · 환급 · 시전 가능 ===================== */
function canStart(c){ // 이 카드를 이번 턴에 시작할 칸이 있는가
  if(S.over||S.turn!=='player'||S.units.player.frozen>0) return false;
  if(S.charge) return false; // 이미 얹는 중이면 다른 카드 불가
  if(c.cast>=4) return S.kan>0; // 대주문=얹기 시작(남은 칸 전부 투입)
  return S.kan>=c.cast;
}
function chainRefund(el,actor){ if(el===S.lastEl && S.refund<4){ S.kan++; S.refund++;
    if(actor==='player') log('<span class="sys">연쇄 환급 +1 칸 ('+S.refund+'/4) — 같은 계열 이어 감</span>'); }
  S.lastEl=el; }
function isChain(c){ return (c.type==='직격'||c.type==='표면'||c.type==='필드') && c.el!=='몸'&&c.el!=='주술'; }

/* ===================== 카드 발동 ===================== */
function resolveCard(c, tq, tr, actor){
  const me=S.units[actor], foe=S.units[actor==='player'?'enemy':'player'];
  if(c.type==='이동'){ me.q=tq;me.r=tr; log(short(me)+' 스무 걸음 이동'); if(S.surf[key(tq,tr)]==='얼음판')freezeIfOn(tq,tr); return; }
  if(c.type==='방어'){ me.shield+=c.shield; log('<span class="sys">'+short(me)+' 굳은 살갗 방패 +'+c.shield+'</span>'); return; }
  if(c.type==='파훼'){ // 말문 막기: 적이 소리/그림 영창 얹는 중이면 끊음
    if(S.charge && S.charge.who!==actor){ const cc=S.charge.card;
      if(GIL[cc.길].intr){ log('<span class="warn">★ 말문 막기! '+short(foe)+'의 '+cc.n+' 영창이 끊겼다 (칸 '+S.charge.acc+' 날림)</span>'); S.charge=null; foe.exposed=false; }
      else log('<span class="mae">'+cc.n+'은(는) '+GIL[cc.길].k+'이라 말로 못 끊는다</span>');
    } else log('끊을 영창이 없다'); return;
  }
  if(c.type==='벽'){
    if(c.wall==='둘레'){ DIRS.forEach(d=>{const q=me.q+d[0],r=me.r+d[1]; if(inField(q,r)&&!unitAt(q,r)) S.walls[key(q,r)]={dur:c.dur};}); log('<span class="sis">얼음 성벽: 둘레에 벽</span>'); }
    else { S.walls[key(tq,tr)]={dur:c.dur}; log((c.길==='진'?'<span class="grim">돌벽 진':'돌벽')+' 설치 ('+tq+','+tr+')</span>'); }
    return;
  }
  if(c.type==='선새김진'){ // 그림길: 진을 깔아 둔다 — 밟으면 발동
    S.jin[key(tq,tr)]={owner:actor,trap:c.trap,el:c.el,name:c.n};
    log('<span class="grim">'+short(me)+' '+c.n+' 선새김 — ('+tq+','+tr+') 잠든 진. 적이 밟으면 깬다</span>'); return;
  }
  if(c.type==='바람'){ const k=key(tq,tr), cur=S.surf[k];
    if(cur==='불'){ S.surf[k]='번짐불'; log('<span class="zar">불+바람 → 번짐불(확산)</span>'); }
    else if(cur){ delete S.surf[k]; log('바람이 '+SURF[cur].t+' 표면을 걷음'); }
    else log('바람 — 걷을 표면 없음'); return;
  }
  if(c.type==='밀침'){ const tgt=unitAt(tq,tr); if(tgt){ const dq=Math.sign(tgt.q-me.q),dr=Math.sign(tgt.r-me.r);
      let nq=tgt.q,nr=tgt.r; for(let i=0;i<c.knock;i++){const a=tgt.q+dq*(i+1),b=tgt.r+dr*(i+1); if(inField(a,b)&&!unitAt(a,b)&&!S.walls[key(a,b)]){nq=a;nr=b;}}
      tgt.q=nq;tgt.r=nr; log('<span class="hur">몰이 바람: '+short(tgt)+' 밀려남</span>'); checkJin(tgt); if(S.surf[key(nq,nr)]==='얼음판')freezeIfOn(nq,nr);} return;
  }
  if(c.type==='무장떨굼'){ const u=unitAt(tq,tr); if(u&&u.side!==actor){ u.disarm=1; log('<span class="sis">'+short(u)+' 무장 떨굼 — 다음 근접 무력</span>'); } return; }
  if(c.type==='표면'||c.type==='필드'){ const tiles=c.aoe?tilesIn(tq,tr,c.aoe):[{q:tq,r:tr}];
    tiles.forEach(t=>applySurface(t.q,t.r,c.leaves));
    if(c.cc){ tiles.forEach(t=>{const u=unitAt(t.q,t.r); if(u&&u.side!==actor) applyCC(u,c.cc);}); } return;
  }
  if(c.type==='제어'){ const u=unitAt(tq,tr); if(u&&u.side!==actor) applyCC(u,c.cc); return; }
  if(c.type==='직격'||(c.type==='대주문'&&c.kind==='직격')){
    const tiles=c.aoe?tilesIn(tq,tr,c.aoe):[{q:tq,r:tr}];
    tiles.forEach(t=>{ const u=unitAt(t.q,t.r); let dmg=c.dmg;
      if(u&&u.side!==actor){ let hit=false;
        if(c.combo && c.combo.s.includes(S.surf[key(t.q,t.r)])){ dmg=c.combo.b; hit=true; }
        dealDmg(u,dmg,'<span class="'+(c.el==='서리'?'sis':c.el==='불'?'zar':c.el==='주술'?'mae':'')+'">['+c.n+']</span>'+(hit?' <span class="warn">합!</span>':''));
      }
      if(c.leaves) applySurface(t.q,t.r,c.leaves);
    }); return;
  }
  if(c.type==='대주문'&&c.kind==='겨울'){ // 내려앉는 겨울: 판에 겨울을 앉힘
    const tiles=tilesIn(tq,tr,c.aoe);
    tiles.forEach(t=>{ const cur=S.surf[key(t.q,t.r)];
      if(cur==='젖음'||cur==='얼음판'){ S.surf[key(t.q,t.r)]='얼음판'; freezeIfOn(t.q,t.r); }
      else if(cur==='불'||cur==='번짐불'){ delete S.surf[key(t.q,t.r)]; }
      else S.surf[key(t.q,t.r)]='서리';
      const u=unitAt(t.q,t.r); if(u&&u.side!==actor){ applyCC(u,{type:'slow',dur:2}); dealDmg(u,60,'<span class="sis">[내려앉는 겨울]</span>'); }
    });
    log('<span class="sis">★ 내려앉는 겨울 — 판에 겨울이 앉았다(서리·얼음판·둔화)</span>'); return;
  }
}
function applyCC(u,cc){ if(cc.type==='slow'){u.slow=Math.max(u.slow,cc.dur); log('<span class="sis">'+short(u)+' 걸음 느려짐('+cc.dur+'턴)</span>');}
  if(cc.type==='freeze'){u.frozen=Math.max(u.frozen,cc.dur); log('<span class="sis">'+short(u)+' 얼어붙음('+cc.dur+'턴)</span>');} }
function checkJin(u){ // 유닛이 선 자리에 적의 잠든 진이 있으면 깬다
  const j=S.jin[key(u.q,u.r)]; if(j && j.owner!==u.side){ log('<span class="grim">★ '+short(u)+'이(가) '+j.name+'을(를) 밟아 진이 깼다</span>');
    if(j.trap.dmg) dealDmg(u,j.trap.dmg,'<span class="grim">['+j.name+']</span>'); if(j.trap.cc) applyCC(u,j.trap.cc); delete S.jin[key(u.q,u.r)]; } }

/* ===================== 시전 (즉발 / 얹기=차징) ===================== */
function needsTarget(c){ return ['직격','대주문','표면','필드','밀침','바람','제어','이동','무장떨굼','선새김진'].includes(c.type) || (c.type==='벽'&&c.wall==='하나'); }
function targetOK(c,tq,tr,me){
  if(hexDist(me,{q:tq,r:tr})>(c.type==='이동'?c.mv:c.rng)) return {ok:false,msg:'사거리 밖'};
  // 과녁=눈: 소리길 직격/제어는 시야가 필요. 매개길(through)·몸길은 무시.
  if((c.type==='직격'||c.type==='대주문'||c.type==='제어') && GIL[c.길].los && !c.through){
    if(!hasLoS(me,{q:tq,r:tr})) return {ok:false,msg:'벽에 시야가 막힘 — 언령은 안 보이면 못 건다 (주술은 우회)'};
  }
  return {ok:true};
}
function playCard(i,tq,tr){
  const c=CARDS[i], me=S.units.player;
  const t=targetOK(c,tq,tr,me); if(!t.ok){ hint(t.msg); return; }
  if(c.cast>=4){ // 대주문 = 얹기 시작
    const put=S.kan; S.kan=0;
    S.charge={who:'player',i,card:c,tq,tr,acc:put,need:c.cast};
    me.exposed=true;
    log('<span class="warn">'+c.n+' 영창 시작 — 칸 '+put+'/'+c.need+' 얹음. 완성까지 무방비(자리 값). 적이 말문 막기로 끊을 수 있다</span>');
    S.sel=null; render(); return;
  }
  if(S.kan<c.cast){ hint('칸 부족'); return; }
  S.kan-=c.cast;
  if(isChain(c)) chainRefund(c.el,'player');
  resolveCard(c,tq,tr,'player');
  S.sel=null;
  if(S.over){render();return;}
  if(S.kan<=0){ log('<span class="t">칸 소진 — 턴을 넘기세요</span>'); }
  render();
}
function selectCard(i){ const c=CARDS[i]; if(!canStart(c)){hint('칸이 부족하거나 지금 낼 수 없음');return;}
  S.sel={kind:'card',i}; hint(needsTarget(c)?('대상 헥스 클릭 · 사거리 '+ (c.type==='이동'?c.mv:c.rng)+(c.through?' · 벽 뒤 가능(주술)':'')):'클릭해 발동');
  if(!needsTarget(c)){ if(c.cast>=4){/*대주문 자기타겟*/ playCard(i,S.units.player.q,S.units.player.r);} else playCard(i,S.units.player.q,S.units.player.r); }
  render();
}
function clickHex(q,r){
  if(S.over) return;
  if(S.sel&&S.sel.kind==='card'){ const c=CARDS[S.sel.i];
    if(c.type==='이동'){ if(hexDist(S.units.player,{q,r})<=c.mv&&!unitAt(q,r)&&!S.walls[key(q,r)]){playCard(S.sel.i,q,r);} else hint('이동 불가'); return; }
    playCard(S.sel.i,q,r); return;
  }
  if(S.sel&&S.sel.kind==='move'){
    if(S.kan<1){hint('이동도 칸 1이 든다 — 칸 부족');return;}
    if(hexDist(S.units.player,{q,r})<=2&&!unitAt(q,r)&&!S.walls[key(q,r)]&&S.units.player.frozen<=0){
      const d=hexDist(S.units.player,{q,r}); S.units.player.q=q;S.units.player.r=r; S.kan-=1;
      log('아군 이동('+d+'칸 거리, 칸 1) '); checkJin(S.units.player); S.sel=null; render(); } else hint('이동 불가');
    return;
  }
}
function clickUnit(u){ if(S.over)return; if(u.side==='player'&&S.turn==='player'){ S.sel={kind:'move'}; hint('이동할 헥스 클릭(거리 2 이내, 칸 1)'+(S.units.player.frozen>0?' — 얼어붙어 불가':'')); render(); } }

/* ===================== 턴 진행 ===================== */
function endTurn(){ if(S.over)return; surfaceTick(); if(S.over){render();return;} S.turn='enemy'; hint('적 턴...'); render(); setTimeout(aiTurn,500); }
function startTurn(who){
  S.turn=who; S.kan=S.kanMax; S.refund=0; S.lastEl=null;
  const u=S.units[who]; if(u.slow>0){S.kan=Math.max(1,S.kanMax-2);u.slow--;} if(u.frozen>0){u.frozen--;}
}
function resolveOwnCharge(who){ // 제 턴 시작 시 얹던 대주문 완성 시도
  if(S.charge && S.charge.who===who){ const ch=S.charge, me=S.units[who];
    const put=Math.min(S.kan, ch.need-ch.acc); S.kan-=put; ch.acc+=put;
    if(ch.acc>=ch.need){ me.exposed=false; log('<span class="warn">★ '+ch.card.n+' 영창 완성!</span>');
      const t=targetOK(ch.card,ch.tq,ch.tr,me); if(t.ok) resolveCard(ch.card,ch.tq,ch.tr,who); else { log('완성했으나 과녁을 잃음(이동/시야)'); }
      S.charge=null; }
    else log('<span class="t">'+ch.card.n+' 계속 얹는 중 '+ch.acc+'/'+ch.need+' (여전히 무방비)</span>');
  }
}
function startTurnPlayer(){ S.round++; startTurn('player'); resolveOwnCharge('player'); hint('당신의 턴 · 카드 또는 이동'); render(); }
function surfaceTick(){
  const spread=[];
  for(const k in S.surf){ if(S.surf[k]==='번짐불'){ const [q,r]=k.split(',').map(Number);
      const u=unitAt(q,r); if(u) dealDmg(u,40,'<span class="zar">[번짐불 도트]</span>');
      DIRS.forEach(d=>{const a=q+d[0],b=r+d[1],kk=key(a,b); if(inField(a,b)&&!S.surf[kk]&&Math.random()<0.5) spread.push(kk);}); } }
  spread.forEach(k=>{S.surf[k]='번짐불';});
  for(const k in S.walls){ S.walls[k].dur--; if(S.walls[k].dur<=0) delete S.walls[k]; }
}
function aiTurn(){
  startTurn('enemy'); resolveOwnCharge('enemy'); render();
  const me=S.units.enemy, foe=S.units.player;
  let guard=0;
  const step=()=>{
    if(S.over){render();return;}
    guard++; if(guard>14){ finishAI(); return; }
    // 1) 플레이어가 영창 무방비면: 말문 막기 우선 → 없으면 그냥 때림(무방비 ×1.5)
    if(S.charge && S.charge.who==='player' && GIL[S.charge.card.길].intr && S.kan>=1){
      const p=CARDS.find(x=>x.n==='말문 막기');
      if(hexDist(me,foe)<=p.rng && hasLoS(me,foe)){ S.kan-=1; resolveCard(p,foe.q,foe.r,'enemy'); render(); setTimeout(step,450); return; }
    }
    const d=hexDist(me,foe);
    if(d>5 && S.kan>=1){ // 접근 (칸 1)
      let best=null,bestD=d; DIRS.forEach(dir=>{const q=me.q+dir[0],r=me.r+dir[1]; if(inField(q,r)&&!unitAt(q,r)&&!S.walls[key(q,r)]){const nd=hexDist({q,r},foe); if(nd<bestD){bestD=nd;best={q,r};}}});
      if(best){me.q=best.q;me.r=best.r; S.kan-=1; checkJin(me); log('<span class="t">적 접근 (칸 1)</span>'); render(); setTimeout(step,320); return;}
    }
    const strikeName=(S.level&&S.level.enemy.strike)||'불덩이';
    const c=CARDS.find(x=>x.n===strikeName)||CARDS.find(x=>x.n==='불덩이');
    if(d<=5 && S.kan>=c.cast && hasLoS(me,foe)){ // 적 직격(레벨별 계열)
      S.kan-=c.cast; if(isChain(c))chainRefund(c.el,'enemy');
      resolveCard(c,foe.q,foe.r,'enemy'); render();
      if(S.kan>0){ setTimeout(step,420); return; }
    }
    if(d<=5 && S.kan>=1 && !hasLoS(me,foe)){ log('<span class="t">적: 시야 막힘 — 돌아갈 칸 없음</span>'); }
    finishAI();
  };
  setTimeout(step,300);
}
function finishAI(){ surfaceTick(); if(S.over){render();return;} startTurnPlayer(); }

/* ===================== 렌더 ===================== */
function render(){
  const g=document.getElementById('grid'); if(!g)return; let s='';
  TILES.forEach(t=>{ const k=key(t.q,t.r); const sf=S.surf[k]; const fill=sf?SURF[sf].c:'#12181f';
    const op=sf?0.55:1; s+='<polygon points="'+hexPoly(t.q,t.r)+'" fill="'+fill+'" fill-opacity="'+op+'" stroke="#263140" stroke-width="1" data-q="'+t.q+'" data-r="'+t.r+'" class="hx"/>';
    if(sf){const c=px(t.q,t.r);s+='<text x="'+c.x+'" y="'+(c.y+3)+'" text-anchor="middle" font-size="9" fill="#0a1016" class="surflabel">'+SURF[sf].t+'</text>';}
  });
  // 잠든 진
  for(const k in S.jin){const [q,r]=k.split(',').map(Number);const c=px(q,r);
    s+='<polygon points="'+hexPoly(q,r)+'" fill="none" stroke="'+GIL['진'].c+'" stroke-width="2" stroke-dasharray="4 3" pointer-events="none"/><text x="'+c.x+'" y="'+(c.y+4)+'" text-anchor="middle" font-size="12" fill="'+GIL['진'].c+'">◈</text>';}
  // 벽
  for(const k in S.walls){const [q,r]=k.split(',').map(Number);const c=px(q,r);s+='<polygon points="'+hexPoly(q,r)+'" fill="#5a6b7a" stroke="#8fa3b3" stroke-width="2"/><text x="'+c.x+'" y="'+(c.y+4)+'" text-anchor="middle" font-size="12" fill="#0a1016">▦</text>';}
  // 하이라이트
  if(S.sel&&!S.over){ const me=S.units.player; TILES.forEach(t=>{let ok=false;
    if(S.sel.kind==='card'){const c=CARDS[S.sel.i]; const rng=c.type==='이동'?c.mv:c.rng; if(rng&&hexDist(me,t)<=rng)ok=true;}
    if(S.sel.kind==='move'){ if(hexDist(me,t)<=2&&!unitAt(t.q,t.r))ok=true;}
    if(ok){ let block=false;
      if(S.sel.kind==='card'){const c=CARDS[S.sel.i]; if((c.type==='직격'||c.type==='대주문'||c.type==='제어')&&GIL[c.길].los&&!c.through&&!hasLoS(me,t))block=true;}
      s+='<polygon points="'+hexPoly(t.q,t.r)+'" fill="'+(block?'#ff5555':'#ffd479')+'" fill-opacity="'+(block?0.06:0.12)+'" stroke="'+(block?'#ff5555':'#ffd479')+'" stroke-width="1.3" pointer-events="none"/>';}
  });}
  // 유닛
  for(const u of Object.values(S.units)){ if(u.hp<=0)continue; const c=px(u.q,u.r);
    const col=u.side==='player'?'#3a86e0':'#e0574a';
    if(u.exposed)s+='<circle cx="'+c.x+'" cy="'+c.y+'" r="21" fill="none" stroke="#ffd479" stroke-width="2" stroke-dasharray="2 3"/>';
    s+='<circle cx="'+c.x+'" cy="'+c.y+'" r="16" fill="'+col+'" stroke="#0a0d12" stroke-width="2" data-unit="'+u.side+'"/>';
    s+='<text x="'+c.x+'" y="'+(c.y+4)+'" text-anchor="middle" font-size="13" fill="#fff">'+(u.side==='player'?'我':'敵')+'</text>';
    if(u.shield>0)s+='<circle cx="'+c.x+'" cy="'+c.y+'" r="19" fill="none" stroke="#8fd18f" stroke-width="2" stroke-dasharray="3 3"/>';
    if(u.frozen>0)s+='<text x="'+(c.x+13)+'" y="'+(c.y-10)+'" font-size="12">❄</text>';
    if(u.slow>0)s+='<text x="'+(c.x-20)+'" y="'+(c.y-10)+'" font-size="11">🐌</text>';
    if(u.exposed)s+='<text x="'+(c.x-6)+'" y="'+(c.y+30)+'" font-size="10" fill="#ffd479">영창</text>';
  }
  g.innerHTML=s;
  g.querySelectorAll('.hx').forEach(p=>p.onclick=()=>clickHex(+p.dataset.q,+p.dataset.r));
  g.querySelectorAll('[data-unit]').forEach(c=>c.onclick=(e)=>{e.stopPropagation();clickUnit(S.units[c.dataset.unit]);});
  document.getElementById('u-enemy').innerHTML=unitPanel(S.units.enemy);
  document.getElementById('u-player').innerHTML=unitPanel(S.units.player);
  // 칸 표시
  let kd=''; for(let i=0;i<S.kanMax;i++)kd+='<span class="kandot'+(i<S.kan?' on':'')+'"></span>'; document.getElementById('kan').innerHTML=kd;
  document.getElementById('round').textContent='라운드 '+S.round+' · '+(S.turn==='player'?'내 턴':'적 턴')+(S.charge?' · '+(S.charge.who==='player'?'내':'적')+' 영창 '+S.charge.acc+'/'+S.charge.need:'');
  renderFilt();
  const hand=document.getElementById('hand'); const list=CARDS.map((c,i)=>({c,i})).filter(o=>S.filt==='전체'||GIL[o.c.길].k===S.filt);
  hand.innerHTML=list.map(({c,i})=>{
    const dis=!canStart(c)?' disabled':''; const sel=(S.sel&&S.sel.kind==='card'&&S.sel.i===i)?' sel':'';
    const gi=GIL[c.길];
    return '<div class="card'+dis+sel+'" data-i="'+i+'" style="border-left-color:'+gi.c+'"><span class="cost">'+c.cast+'칸'+(c.cast>=4?'⚡':'')+'</span>'+
      '<div class="nm"><span class="el" style="background:'+(elColor[c.el]||'#888')+'"></span>'+c.n+'</div>'+
      '<div class="meta">'+c.el+'·T'+c.t+'</div><div class="fx">'+cardFx(c)+'</div>'+
      '<div class="gil" style="color:'+gi.c+'">'+gilTag(c,gi)+'</div></div>';
  }).join('');
  hand.querySelectorAll('.card').forEach(el=>el.onclick=()=>{if(!el.classList.contains('disabled'))selectCard(+el.dataset.i);});
  document.getElementById('legend').innerHTML=Object.keys(SURF).map(k=>'<span><span class="sw" style="background:'+SURF[k].c+'"></span>'+SURF[k].t+'</span>').join('')+'<span><span class="sw" style="background:#5a6b7a"></span>벽</span><span><span class="sw" style="background:'+GIL['진'].c+'"></span>잠든 진</span>';
}
function renderFilt(){ const f=document.getElementById('filt'); const paths=['전체','소리길','몸길','그림길','매개길'];
  f.innerHTML=paths.map(p=>'<button class="'+(S.filt===p?'act':'')+'" data-p="'+p+'">'+p+'</button>').join('');
  f.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.filt=b.dataset.p;render();}); }
function gilTag(c,gi){ let bits=[gi.k];
  if(gi.los&&!c.through&&(c.type==='직격'||c.type==='대주문'||c.type==='제어'))bits.push('과녁=눈');
  if(c.through)bits.push('벽 뒤 우회');
  if(!gi.intr&&c.cast>=4)bits.push('안 끊김');
  if(c.cast>=4&&gi.intr)bits.push('말문에 끊김');
  if(c.type==='선새김진')bits.push('선새김');
  return bits.join(' · '); }
function cardFx(c){
  if(c.type==='직격'||(c.type==='대주문'&&c.kind==='직격'))return '직격 '+c.dmg+(c.combo?' / 합 '+c.combo.b:'')+(c.aoe?' · 광역':'')+(c.leaves?' · '+c.leaves+'표면':'');
  if(c.type==='대주문'&&c.kind==='겨울')return '판에 겨울(서리·결빙·둔화)';
  if(c.type==='표면'||c.type==='필드')return (c.leaves||'')+' 표면'+(c.cc?' · 슬로우':'')+(c.aoe?' · 광역':'');
  if(c.type==='제어')return '걸음 느림 '+c.cc.dur+'턴';
  if(c.type==='무장떨굼')return '무장 떨굼';
  if(c.type==='이동')return '이동 '+c.mv+'칸';
  if(c.type==='방어')return '방패 '+c.shield;
  if(c.type==='벽')return c.wall==='둘레'?'둘레 얼음벽':'벽 1칸';
  if(c.type==='밀침')return '밀침 '+c.knock+'칸';
  if(c.type==='바람')return '불→번짐불 / 표면 걷기';
  if(c.type==='선새김진')return '잠든 진 — 밟으면 '+(c.trap.cc?(c.trap.cc.type==='freeze'?'결빙':'둔화'):'')+(c.trap.dmg?'+'+c.trap.dmg:'');
  if(c.type==='파훼')return '적 언령/진 영창 끊기';
  return '';
}
function unitPanel(u){
  const pct=Math.round(u.hp/u.max*100); const col=u.side==='player'?'#3a86e0':'#e0574a';
  return '<div class="row"><b>'+u.name+'</b><span class="pill">HP '+u.hp+'</span></div>'+
    '<div class="hpbar"><div class="hpfill" style="width:'+pct+'%;background:'+col+'"></div></div>'+
    '<div class="row" style="font-size:11px;color:var(--dim)"><span>('+u.q+','+u.r+')</span><span>'+
    (u.shield>0?'방패 '+u.shield+' · ':'')+(u.slow>0?'슬로우 · ':'')+(u.frozen>0?'결빙 · ':'')+(u.exposed?'<span style="color:#ffd479">영창 무방비</span>':'')+'</span></div>';
}
function hint(t){const el=document.getElementById('hint');if(el)el.textContent=t;}

/* ===================== 버튼 ===================== */
if(typeof document!=='undefined'&&document.getElementById('endturn')){
  document.getElementById('endturn').onclick=endTurn;
  document.getElementById('reset').onclick=()=>{document.getElementById('log').innerHTML='';fresh();};
  document.getElementById('deselect').onclick=()=>{S.sel=null;hint('선택 해제');render();};
  const sel=document.getElementById('lvlsel');
  if(sel){ sel.innerHTML=LEVELS.map((l,i)=>'<option value="'+i+'">L'+(i+1)+' · '+l.stage+'</option>').join('');
    sel.onchange=()=>{ document.getElementById('log').innerHTML=''; applyLevel(+sel.value); }; }
  applyLevel(0);
}
/* 헤드리스 테스트용 export */
if(typeof module!=='undefined'){ module.exports={get S(){return S;},get CURLEVEL(){return CURLEVEL;},LEVELS,applyLevel,fresh,resolveCard,playCard,CARDS,hasLoS,hexLine,hexDist,GIL,key,startTurn,resolveOwnCharge,targetOK,checkJin,get TILES(){return TILES;},get R(){return R;}}; }
</script>
