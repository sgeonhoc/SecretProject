;   ★C++ 클래스(SecretProjectGameMode)가 아니라 BP를 가리켜야 한다 — 조작에 필요한 입력 매핑(IMC)과
;   메시가 붙은 BP_PlayerCharacter / BP_SecretProjectPlayerController가 이 BP에만 물려 있다.
;   진행·오프닝 로직은 C++ 부모에 있으므로 BP가 그대로 물려받는다.
